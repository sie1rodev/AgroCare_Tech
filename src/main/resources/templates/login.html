        .screen { min-height: 100vh; min-height: 100dvh; }
        .safe-top { padding-top: var(--top); }
        .safe-bottom { padding-bottom: max(2.5rem, calc(env(safe-area-inset-bottom) + 1.5rem)); }
        .headline { font-family: 'Space Mono', monospace; }

        /*
         * Logo branca, usada como máscara (permite controlar a cor e o tamanho por CSS).
         * Fica embutida porque, antes do login, o Spring Security bloqueia /images.
         */
        .logo {
            width: 16rem;
            aspect-ratio: 800 / 209;
            -webkit-mask: var(--logo) center / contain no-repeat;
            mask: var(--logo) center / contain no-repeat;
        }
        .logo-login { background: #ffffff; }

        /* ---------- Cena: céu, sol e colina ---------- */
        .sky {
            background: radial-gradient(120% 55% at 50% 78%, rgba(150, 150, 78, 0.38) 0%, rgba(120, 128, 64, 0.12) 45%, rgba(0, 0, 0, 0) 75%);
        }
        .glow {
            background: radial-gradient(60% 100% at 50% 100%, rgba(236, 226, 138, 0.9) 0%, rgba(178, 178, 96, 0.38) 42%, rgba(170, 172, 92, 0) 76%);
            transform-origin: 50% 100%;
        }
        .sun {
            left: calc(50% - 8rem);
            background: radial-gradient(circle,
                #fffbe6 0%,
                rgba(252, 240, 182, 0.92) 16%,
                rgba(244, 231, 162, 0.5) 34%,
                rgba(244, 231, 162, 0.16) 52%,
                rgba(244, 231, 162, 0) 68%);
        }
        .sky, .glow, .sun, .logo-wrap, .reveal { will-change: transform, opacity; }

        /* ---------- Abertura: o sol nasce atrás da colina e a cena vira o login ----------
         * intro   -> noite: logo no meio do céu (invisível), sol escondido atrás da colina
         * sunrise -> o sol sobe, o céu clareia e a logo aparece
         * settle  -> a logo sobe até o topo e o conteúdo do login entra
         */
        .intro .sky { opacity: 0; }
        .intro .glow { opacity: 0; transform: scaleY(0.25); }
        .intro .sun { transform: translateY(10rem) scale(0.85); }
        .intro .logo-wrap { opacity: 0; transform: translateY(calc(36vh - var(--top))) scale(1.12); }
        @supports (height: 1dvh) {
            .intro .logo-wrap { transform: translateY(calc(36dvh - var(--top))) scale(1.12); }
        }
        .intro .reveal { opacity: 0; transform: translateY(18px); }

        .sunrise .sky { opacity: 1; transition: opacity 3.2s ease-out; }
        .sunrise .glow { opacity: 1; transform: none; transition: opacity 2.8s 0.4s ease-out, transform 3.2s 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .sunrise .sun { transform: none; transition: transform 3.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .sunrise .logo-wrap { opacity: 1; transition: opacity 1.6s 0.9s ease-out; }

        .settle .logo-wrap { opacity: 1; transform: none; transition: transform 1.6s var(--ease); }
        .settle .reveal { opacity: 1; transform: none; transition: opacity 0.9s 1s ease-out, transform 0.9s 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .settle .reveal-2 { transition-delay: 1.2s; }
    </style>
</head>
<body class="text-white">
<!-- Ativa a abertura antes da primeira pintura (só na primeira visita da sessão) -->
<script>
    (function () {
        // Depois do logout, apaga os dados guardados no navegador (reforço ao Clear-Site-Data do servidor)
        if (new URLSearchParams(location.search).has('logout')) {
            try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        }
        let seen = false;
        try { seen = sessionStorage.getItem('agrocare.splash') === '1'; sessionStorage.setItem('agrocare.splash', '1'); } catch (e) {}
        const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!seen && !calm) document.body.classList.add('intro');
    })();
</script>

<div class="sky fixed inset-0 pointer-events-none" aria-hidden="true"></div>

<main class="screen relative flex flex-col overflow-hidden">

    <!-- Logo -->
    <header class="safe-top px-6 flex justify-center relative z-10">
        <div class="logo-wrap">
            <div class="relative">
                <div class="logo logo-login" role="img" aria-label="Agrocare Tech"></div>
            </div>
        </div>
    </header>

    <div class="flex-1 min-h-[6rem]"></div>

    <!-- Colina com o sol nascendo atrás -->
    <section class="hill relative">
        <div class="glow absolute inset-x-0 -top-56 h-60 pointer-events-none"></div>
        <div class="sun absolute -top-36 w-64 h-64 rounded-full pointer-events-none" aria-hidden="true"></div>
        <svg class="absolute inset-x-0 -top-16 w-full h-[calc(4rem+2px)]" viewBox="0 0 400 66" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 66 L0 40 C 110 6, 260 -4, 400 18 L400 66 Z" fill="#1b3320"/>
        </svg>

        <div class="relative bg-[#1b3320] px-6 safe-bottom">
            <div class="w-full max-w-md mx-auto">
                <h1 class="headline text-2xl leading-snug pt-6 mb-10 reveal">
                    Faça parte da nova geração agropecuarista do Brasil!
                </h1>

                <div th:if="${param.error}" class="flex items-start gap-2 bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-2xl p-3 mb-4">
                    <i class="fas fa-circle-exclamation mt-0.5"></i>
                    <span>Não foi possível entrar. Tente novamente.</span>
                </div>
                <div th:if="${param.logout}" class="flex items-start gap-2 bg-emerald-500/10 border border-emerald-500/40 text-emerald-300 text-sm rounded-2xl p-3 mb-4">
                    <i class="fas fa-circle-check mt-0.5"></i>
                    <span>Você saiu da sua conta.</span>
                </div>

                <div class="reveal reveal-2 space-y-3">
                    <a href="/oauth2/authorization/google"
                       class="flex items-center justify-center gap-3 w-full h-14 rounded-full bg-white hover:bg-gray-100 text-[#1b3320] active:scale-[0.98] font-semibold shadow-lg shadow-black/20 focus:outline-none focus:ring-2 focus:ring-[#c3cf7d] focus:ring-offset-2 focus:ring-offset-[#1b3320] transition">
                        <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Entrar com Google
                    </a>
                    <a href="/oauth2/authorization/github"
                       class="flex items-center justify-center gap-3 w-full h-14 rounded-full bg-[#6fae7b] hover:bg-[#7fbe8a] active:scale-[0.98] font-semibold shadow-lg shadow-black/20 focus:outline-none focus:ring-2 focus:ring-[#c3cf7d] focus:ring-offset-2 focus:ring-offset-[#1b3320] transition">
                        <i class="fab fa-github text-xl"></i> Entrar com GitHub
                    </a>
                    <p class="text-center text-xs text-gray-400 pt-1">
                        Primeiro acesso? Sua conta é criada automaticamente.
                    </p>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    // Depois da luz nascer, a abertura se transforma no login
    if (document.body.classList.contains('intro')) {
        const body = document.body;
        // 1) o sol nasce (depois da primeira pintura, para a transição acontecer)
        requestAnimationFrame(function () {
            requestAnimationFrame(function () { body.classList.add('sunrise'); });
        });
        // 2) a logo sobe e o login aparece
        setTimeout(function () { body.classList.add('settle'); }, 3000);
        // 3) limpa as classes da abertura (o estado final é o mesmo do login)
        setTimeout(function () { body.classList.remove('intro', 'sunrise', 'settle'); }, 6500);
    }
</script>
</body>
</html>
